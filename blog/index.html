    /* ==========================================
       基本

    main {
      width: min(1000px, calc(100% - 40px));
      margin: 0 auto;
      padding: 90px 0 100px;
    }


    /* ==========================================
       ページヘッダー
    ========================================== */

    .page-header {
      margin-bottom: 55px;
    }

    .page-label {
      display: inline-block;
      margin-bottom: 15px;
      padding: 6px 12px;

      border: 1px solid #ddd;
      border-radius: 999px;

      color: #777;
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    .page-title {
      margin: 0;

      font-size: clamp(38px, 7vw, 64px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .page-desc {
      max-width: 700px;
      margin: 22px 0 0;

      color: #777;
      font-size: 15px;
      line-height: 1.9;
    }


    /* ==========================================
       ブログ一覧
    ========================================== */

    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }


    /* ==========================================
       ブログカード
    ========================================== */

    .gallery-card {
      display: grid;

      /*
       * 左：画像
       * 右：記事情報
       */
      grid-template-columns: 300px 1fr;

      min-height: 190px;

      overflow: hidden;

      border: 1px solid #e4e4e4;
      border-radius: 16px;

      background: #fff;

      color: inherit;
      text-decoration: none;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }

    .gallery-card:hover {
      transform: translateY(-3px);

      border-color: #d5d5d5;

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.07);
    }


    /* ==========================================
       左側：画像
    ========================================== */

    .card-image {
      width: 100%;
      height: 100%;

      min-height: 190px;

      overflow: hidden;

      background: #f2f2f2;
    }

    .card-image img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform 0.5s ease;
    }

    .gallery-card:hover .card-image img {
      transform: scale(1.04);
    }


    /* ==========================================
       右側：記事情報
    ========================================== */

    .card-content {
      display: flex;
      flex-direction: column;

      justify-content: center;

      padding: 30px 35px;
    }


    /* タグ */

    .card-tag {
      align-self: flex-start;

      margin-bottom: 12px;
      padding: 5px 10px;

      border-radius: 999px;

      background: #f1f1f1;
      color: #666;

      font-size: 11px;
      line-height: 1;
    }


    /* タイトル */

    .card-title {
      margin: 0;

      color: #1c1c1c;

      font-size: 25px;
      line-height: 1.4;
      letter-spacing: -0.02em;
    }


    /* 説明 */

    .card-text {
      max-width: 600px;

      margin: 12px 0 18px;

      color: #777;

      font-size: 14px;
      line-height: 1.8;
    }


    /* 日付 */

    .card-date {
      color: #999;

      font-size: 12px;
      letter-spacing: 0.05em;
    }


    /* ==========================================
       フッター
    ========================================== */

    .page-footer {
      margin-top: 70px;

      padding-top: 30px;

      border-top: 1px solid #e5e5e5;
    }

    .back-link {
      display: inline-flex;
      align-items: center;

      color: #555;

      font-size: 14px;
      text-decoration: none;

      transition: opacity 0.2s ease;
    }

    .back-link:hover {
      opacity: 0.55;
    }


    /* ==========================================
       スマートフォン
    ========================================== */

    @media (max-width: 700px) {

      main {
        width: calc(100% - 28px);
        padding-top: 70px;
      }

      /*
       * スマホでは画像を上、
       * 記事情報を下にする
       */

      .gallery-card {
        display: flex;
        flex-direction: column;
      }

      .card-image {
        height: 210px;
        min-height: 0;
      }

      .card-content {
        padding: 22px;
      }

      .card-title {
        font-size: 21px;
      }

      .card-text {
        font-size: 14px;
      }

    }

  </style>
</head>
